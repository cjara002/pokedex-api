name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: pokedex-508713
  REGION: us-central1
  SERVICE: pokedex-api
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        run: echo "${{ steps.auth.outputs.auth_token }}" | docker login -u oauth2accesstoken --password-stdin https://$REGISTRY

      - name: Build and push image
        run: |
          IMAGE=$REGISTRY/$PROJECT_ID/pokedex/$SERVICE:${{ github.sha }}
          ./mvnw -B spring-boot:build-image -Dspring-boot.build-image.imageName=$IMAGE
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --allow-unauthenticated